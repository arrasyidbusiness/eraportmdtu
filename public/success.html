<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status Pembayaran — E-Raport Digital MDTA/MDTU</title>
<style>
:root{--green:#075a31;--green2:#0a7a42;--bg:#f4f8f5;--ink:#153126;--muted:#68786f;--line:#e2eae5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{width:min(620px,calc(100% - 22px));margin:30px auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(18,65,39,.06);text-align:center}
.icon{font-size:3rem}.title{font-size:1.4rem;font-weight:1000;margin:10px 0}.sub{font-size:.8rem;line-height:1.55;color:var(--muted)}
.status{margin:15px 0;padding:12px;border-radius:12px;background:#f7fbf8;border:1px solid #e2ece6;font-weight:900;color:var(--green)}
.btn{display:block;margin-top:12px;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;text-decoration:none;font-weight:1000}
.btn.secondary{background:#fff;color:var(--green);border:1px solid #dfe8e2}
</style></head>
<body>
<div class="wrap"><div class="card">
  <div class="icon">💳</div>
  <div class="title">Status Pembayaran</div>
  <p class="sub">Sistem sedang memeriksa status transaksi Anda.</p>
  <div id="status" class="status">Memeriksa...</div>
  <div id="actions"></div>
  <a class="btn secondary" href="index.html">Kembali ke Landing Page</a>
</div></div>
<script>
const q=new URLSearchParams(location.search);
const orderId=q.get('order_id');
const access=q.get('access');
const statusEl=document.getElementById('status');
const actions=document.getElementById('actions');
let tries=0;

async function check(){
  if(!orderId){ statusEl.textContent='Order ID tidak ditemukan.'; return; }
  try{
    const r=await fetch('/api/order/'+encodeURIComponent(orderId));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Gagal mengecek status');
    const s=(d.status||'pending').toLowerCase();
    if(['settlement','capture','paid'].includes(s)){
      statusEl.textContent='Pembayaran berhasil dan sudah terverifikasi.';
      const ar=await fetch('/api/access/'+encodeURIComponent(orderId)+'/'+encodeURIComponent(access||''));
      const ad=await ar.json();
      if(ar.ok && ad.url){
        actions.innerHTML='<a class="btn" href="'+ad.url+'" target="_blank" rel="noopener">⬇️ Buka Akses Aplikasi</a>';
      }else{
        actions.innerHTML='<p class="sub">Pembayaran sudah berhasil. Akses sedang disiapkan.</p>';
      }
      return;
    }
    if(['deny','cancel','expire','failure'].includes(s)){
      statusEl.textContent='Pembayaran tidak berhasil / dibatalkan / kedaluwarsa.';
      actions.innerHTML='<a class="btn" href="checkout.html">Coba Pembayaran Lagi</a>';
      return;
    }
    statusEl.textContent='Pembayaran belum selesai. Status: '+s;
    if(++tries < 30) setTimeout(check, 3000);
  }catch(e){
    statusEl.textContent=e.message;
    if(++tries < 20) setTimeout(check, 3000);
  }
}
check();
</script>
</body></html>
